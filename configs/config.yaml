server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

database:
  driver: sqlite
  sqlite_path: ./data/telemetry.db
  postgres_dsn: "postgres://telemetry:telemetry@localhost:5432/telemetry?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

logging:
  level: info

telemetry:
  max_batch_size: 500
  max_point_age: 720h
  max_future_skew: 5m
  ingest_rate_limit: 500
  ingest_burst: 500
  query_default_limit: 200
  query_max_limit: 2000

alert:
  evaluation_interval: 10s
  max_rules_per_scan: 500

retention:
  run_interval: 5m
  raw_retention: 720h
  aggregate_retention: 8760h
  event_retention: 2160h
  failure_retention: 720h
  delete_batch_size: 500

notification:
  max_attempts: 5
  initial_backoff: 1s
  max_backoff: 1m
  request_timeout: 5s
  worker_count: 2
  webhook_url: "http://localhost:8081/webhook"
