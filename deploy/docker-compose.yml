services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production configuration reference for a Postgres-aware build.
  # The checked-in Go binary uses SQLite by default so the project can be
  # verified without external infrastructure; see README for the difference.
  telemetry-alert-postgres:
    profiles: ["postgres"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_DRIVER: postgres
      DATABASE_POSTGRES_DSN: "postgres://telemetry:telemetry@postgres:5432/telemetry?sslmode=disable"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
